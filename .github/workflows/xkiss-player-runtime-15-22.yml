name: XKiss Player Runtime 15.22
on:
  push:
    branches: [main]
    paths:
      - "player/runtime/player-runtime-recovery-*.js"
      - "player.html"
      - "js/player/player-core.js"
      - ".github/workflows/xkiss-player-runtime-15-22.yml"
  workflow_dispatch:
jobs:
  recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Core self-test
        run: node --input-type=module -e "import { runXKissPlayerRuntimeRecoverySelfCheck } from './player/runtime/player-runtime-recovery-self-test.js'; const r=runXKissPlayerRuntimeRecoverySelfCheck(); console.log(JSON.stringify(r,null,2)); if(!r.ok) process.exit(1)"
      - name: Integration test
        run: node --input-type=module -e "import { validateXKissPlayerRuntimeRecoveryIntegration } from './player/runtime/player-runtime-recovery-integration.js'; const r=validateXKissPlayerRuntimeRecoveryIntegration(); console.log(JSON.stringify(r,null,2)); if(!r.ok) process.exit(1)"
      - name: Real browser recovery gate test
        run: |
          npm init -y
          npm install playwright@1.55.0
          npx playwright install chrome
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/xkiss-http.log 2>&1 &
          node --input-type=module <<'NODE'
          import { chromium } from "playwright";
          const browser=await chromium.launch({channel:"chrome",headless:true});
          const page=await browser.newPage();
          await page.goto("http://127.0.0.1:4173/player.html?id=video-001",{waitUntil:"domcontentloaded"});
          await page.waitForFunction(()=>window.XKissPlayerCore?.platformCore?.connected===true);
          const r=await page.evaluate(()=>{const c=window.XKissPlayerCore;return{core:c.platformCore.connected===true,modules:typeof c.getModuleStatus==="function",videoReady:!!c.elements.video}});
          console.log(JSON.stringify({stage:"15.22",...r},null,2));
          if(!r.core||!r.modules||!r.videoReady)process.exit(1);
          await browser.close();
          NODE