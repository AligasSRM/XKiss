name: XKiss Section 17 Complete Self-Test
on:
  push:
    paths:
      - "consumer/**"
      - ".github/workflows/xkiss-section-17.yml"
  workflow_dispatch:
jobs:
  section-17:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Run Section 17 self-test
        run: node --input-type=module -e "import('./consumer/xkiss-consumer-product-section-self-test.js').then(m=>{const r=m.runConsumerProductSectionSelfTest();console.log(JSON.stringify(r,null,2));if(!r.ok)process.exit(1)})"
