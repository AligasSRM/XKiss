name: XKiss Player Runtime 15.17

on:
  push:
    branches: [main]
    paths:
      - "player/runtime/*.js"
      - "player.html"
      - "js/player/player-core.js"
      - "js/player.js"
      - ".github/workflows/xkiss-player-runtime-15-17.yml"
  workflow_dispatch:

jobs:
  player-runtime-state:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Core self-test
        run: |
          node --input-type=module -e "import { runXKissPlayerRuntimeStateSelfCheck } from './player/runtime/player-runtime-state-self-test.js'; const r=runXKissPlayerRuntimeStateSelfCheck(); console.log(JSON.stringify(r,null,2)); if(!r.ok) process.exit(1)"

      - name: Integration test
        run: |
          node --input-type=module -e "import { validateXKissPlayerRuntimeStateIntegration } from './player/runtime/player-runtime-state-integration.js'; const r=validateXKissPlayerRuntimeStateIntegration(); console.log(JSON.stringify(r,null,2)); if(!r.ok) process.exit(1)"

      - name: Install browser
        run: |
          npm init -y
          npm install playwright@1.55.0
          npx playwright install chromium
          npx playwright install chrome

      - name: Start static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/xkiss-http.log 2>&1 &
          echo $! > /tmp/xkiss-http.pid

      - name: Real player runtime state test
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from "playwright";
          const browser = await chromium.launch({ channel: "chrome", headless: true });
          const page = await browser.newPage();
          await page.goto("http://127.0.0.1:4173/player.html?id=video-001", { waitUntil: "domcontentloaded" });
          await page.waitForFunction(() => window.XKissPlayerCore?.platformCore?.connected === true);
          await page.waitForFunction(() => Object.keys(window.XKissPlayerCore?.getModuleStatus?.() || {}).length >= 5);
          const qualities = await page.locator("#qualityMenu [data-quality]").evaluateAll(nodes => nodes.map(n => n.getAttribute("data-quality")));
          if (JSON.stringify(qualities) !== JSON.stringify(["340p","460p","720p","1080p"])) throw new Error("Quality set mismatch");
          const runtime = await page.evaluate(async () => {
            const v = document.getElementById("video");
            v.src = "20260923_234200-3.mp4";
            v.load();
            await new Promise(resolve => {
              const done = () => resolve();
              v.addEventListener("loadedmetadata", done, { once: true });
              v.addEventListener("error", done, { once: true });
              setTimeout(done, 7000);
            });
            return {
              readyState: v.readyState,
              duration: v.duration,
              currentSrc: v.currentSrc,
              error: v.error ? { code: v.error.code, message: v.error.message || "" } : null
            };
          });
          if (runtime.readyState < 1 || runtime.error) throw new Error("Runtime state failed: " + JSON.stringify(runtime));
          const state = await page.evaluate(() => ({
            paused: document.getElementById("video").paused,
            readyState: document.getElementById("video").readyState,
            duration: document.getElementById("video").duration,
            currentSrc: document.getElementById("video").currentSrc
          }));
          if (state.readyState < 1 || !state.currentSrc.endsWith(".mp4")) throw new Error("State unreadable: " + JSON.stringify(state));
          console.log(JSON.stringify({ stage:"15.17", player:"PASS", qualities, runtime, state }, null, 2));
          await browser.close();
          NODE
