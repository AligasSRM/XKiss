name: XKiss Player Runtime 15.23
on:
  push:
    branches: [main]
    paths:
      - "player/runtime/player-runtime-control-*.js"
      - "js/player/player-core.js"
      - "player.html"
      - ".github/workflows/xkiss-player-runtime-15-23.yml"
  workflow_dispatch:
jobs:
  control:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Core self-test
        run: node --input-type=module -e "import { runXKissPlayerRuntimeControlSelfCheck } from './player/runtime/player-runtime-control-self-test.js'; const r=runXKissPlayerRuntimeControlSelfCheck(); console.log(JSON.stringify(r,null,2)); if(!r.ok) process.exit(1)"
      - name: Integration test
        run: node --input-type=module -e "import { validateXKissPlayerRuntimeControlIntegration } from './player/runtime/player-runtime-control-integration.js'; const r=validateXKissPlayerRuntimeControlIntegration(); console.log(JSON.stringify(r,null,2)); if(!r.ok) process.exit(1)"
      - name: Real browser control test
        run: |
          npm init -y
          npm install playwright@1.55.0
          npx playwright install chrome
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/xkiss-http.log 2>&1 &
          node --input-type=module <<'NODE'
          import { chromium } from "playwright";
          const browser=await chromium.launch({channel:"chrome",headless:true});
          const page=await browser.newPage();
          await page.goto("http://127.0.0.1:4173/player.html?id=video-001",{waitUntil:"domcontentloaded"});
          await page.waitForFunction(()=>window.XKissPlayerCore?.platformCore?.connected===true);
          const r=await page.evaluate(async()=>{const c=window.XKissPlayerCore;const pause=c.control("pause");const mute=c.control("mute",true);const volume=c.control("volume",0.5);const speed=c.control("speed",1.25);const seek=c.control("seek",0);const reset=c.control("reset");return{core:c.platformCore.connected===true,pause:pause.ok===true,mute:mute.value===true,volume:volume.value===0.5,speed:speed.value===1.25,seek:seek.ok===true,reset:reset.ok===true}});
          console.log(JSON.stringify({stage:"15.23",...r},null,2));
          if(!Object.values(r).every(Boolean))process.exit(1);
          await browser.close();
          NODE