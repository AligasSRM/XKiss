name: Section 14 Security Tests
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  security-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - run: npm test
      - run: node --check worker.js
      - run: node --check security/super-admin-mfa.js
      - run: node --check security/xkiss-auth-backend.js
      - run: node --check security/admin-security-audit.js
      - run: node --check security/admin-mfa-authorization.js
