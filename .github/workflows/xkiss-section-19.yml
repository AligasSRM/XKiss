name: XKiss Section 19 Production Activation Readiness

on:
  push:
    paths:
      - "activation/**"
      - "audit/xkiss-section-19-master-spec.md"
      - ".github/workflows/xkiss-section-19.yml"
      - "audit/xkiss-final-review.js"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  section-19:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check Section 19
        run: |
          node --check activation/xkiss-production-activation-readiness-core.js
          node --check activation/xkiss-section-19-external-dependencies.js
          node --check activation/xkiss-section-19-lock.js
          node --check activation/xkiss-production-activation-readiness-self-test.js
          node --check activation/xkiss-section-19-regression.js
      - name: Run Section 19 self-test
        run: node --input-type=module -e "import('./activation/xkiss-production-activation-readiness-self-test.js').then(m => { const r=m.runSection19SelfTest(); console.log(JSON.stringify(r,null,2)); if(!r.ok) process.exit(1); })"
      - name: Run Section 19 regression
        run: node --input-type=module -e "import('./activation/xkiss-section-19-regression.js').then(m => { const r=m.runSection19Regression(); console.log(JSON.stringify(r,null,2)); if(!r.ok) process.exit(1); })"
      - name: Run final review
        run: node audit/xkiss-final-review.js
