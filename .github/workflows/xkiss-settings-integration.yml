name: XKiss Settings Integration Test

on:
  push:
    paths:
      - "settings/system-settings-*.js"
      - "settings/xkiss-settings-runtime-core.js"
      - "settings/system-settings-runtime-activation-*.js"
      - "worker.js"
      - "core/xkiss-platform-core.js"
      - "js/player/player-core.js"
      - "js/player/player-pip.js"
      - "js/player/player-fullscreen.js"
      - "js/player/player-speed.js"
      - "js/player/player-quality.js"
      - "js/player/player-controls.js"
      - ".github/workflows/xkiss-settings-integration.yml"
  workflow_dispatch:

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run settings, 15.15, runtime core and platform core integration
        run: |
          node --input-type=module <<'NODE'
          import { getXKissSettingsRuntimeStatus, validateXKissSettingsRuntimeCore } from "./settings/xkiss-settings-runtime-core.js";
          import { getXKissPlatformCoreStatus, validateXKissPlatformCore } from "./core/xkiss-platform-core.js";
          import { runSystemSettingsAuditReviewSelfCheck } from "./settings/system-settings-audit-review-self-test.js";
          import {
            validateSystemSettingsAuditReviewIntegration,
            evaluateSystemSettingsAuditReviewIntegration
          } from "./settings/system-settings-audit-review-integration.js";
          import { runSystemSettingsAuditExportSelfCheck } from "./settings/system-settings-audit-export-self-test.js";
          import {
            validateSystemSettingsAuditExportIntegration,
            evaluateSystemSettingsAuditExportIntegration
          } from "./settings/system-settings-audit-export-integration.js";
          import { runSystemSettingsRuntimeActivationSelfCheck } from "./settings/system-settings-runtime-activation-self-test.js";
          import {
            validateSystemSettingsRuntimeActivationIntegration,
            evaluateSystemSettingsRuntimeActivationIntegration
          } from "./settings/system-settings-runtime-activation-integration.js";

          const runtimeStatus = getXKissSettingsRuntimeStatus();
          const runtimeValidation = validateXKissSettingsRuntimeCore();
          const platformStatus = getXKissPlatformCoreStatus();
          const platformValidation = validateXKissPlatformCore();

          const reviewSelf = runSystemSettingsAuditReviewSelfCheck();
          const reviewIntegration = validateSystemSettingsAuditReviewIntegration();
          const review = evaluateSystemSettingsAuditReviewIntegration({
            authorizationVerified: true,
            retentionStateVerified: true,
            holdStateVerified: true,
            backendConnected: true,
            operation: "review_audit_history"
          });

          const exportSelf = runSystemSettingsAuditExportSelfCheck();
          const exportIntegration = validateSystemSettingsAuditExportIntegration();
          const auditExport = evaluateSystemSettingsAuditExportIntegration({
            authorizationVerified: true,
            retentionStateVerified: true,
            holdStateVerified: true,
            reviewStateVerified: true,
            backendConnected: true,
            operation: "export_audit_history"
          });

          const activationSelf = runSystemSettingsRuntimeActivationSelfCheck();
          const activationIntegration = validateSystemSettingsRuntimeActivationIntegration();
          const activationGate = evaluateSystemSettingsRuntimeActivationIntegration({
            operation: "validate_activation",
            backendConnected: true,
            providersVerified: true,
            authorizationVerified: true,
            auditVerified: true
          });

          const result = {
            runtime_core: {
              status: runtimeStatus,
              validation: runtimeValidation
            },
            platform_core: {
              status: platformStatus,
              validation: platformValidation
            },
            stage_15_13: {
              selfTest: reviewSelf,
              integration: reviewIntegration,
              validReview: review
            },
            stage_15_14: {
              selfTest: exportSelf,
              integration: exportIntegration,
              validExport: auditExport
            },
            stage_15_15: {
              selfTest: activationSelf,
              integration: activationIntegration,
              validActivationGate: activationGate
            },
            allPassed:
              runtimeStatus.ok === true &&
              runtimeStatus.activationGateConnected === true &&
              runtimeStatus.activationAllowed === false &&
              runtimeValidation.ok === true &&
              platformStatus.ok === true &&
              platformStatus.activationGateConnected === true &&
              platformStatus.activationAllowed === false &&
              platformValidation.ok === true &&
              reviewSelf.ok === true &&
              reviewIntegration.ok === true &&
              review.allowed === true &&
              review.activationAllowed === false &&
              exportSelf.ok === true &&
              exportIntegration.ok === true &&
              auditExport.allowed === true &&
              auditExport.activationAllowed === false &&
              activationSelf.ok === true &&
              activationIntegration.ok === true &&
              activationGate.allowed === true &&
              activationGate.activationAllowed === false
          };

          console.log(JSON.stringify(result, null, 2));

          if (!result.allPassed) {
            process.exit(1);
          }
          NODE
