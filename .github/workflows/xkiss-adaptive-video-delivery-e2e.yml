name: XKiss Adaptive Video Delivery E2E

on:
  push:
    branches: [main]
    paths:
      - "player.html"
      - "js/video-data.js"
      - "js/player/player-quality.js"
      - "js/player.js"
      - "tests/adaptive-video-delivery-self-test.mjs"
      - ".github/workflows/xkiss-adaptive-video-delivery-e2e.yml"
  workflow_dispatch:

jobs:
  adaptive-video-delivery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Static delivery contract test
        run: node tests/adaptive-video-delivery-self-test.mjs

      - name: Install media and browser test tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          npm install --no-save playwright@1.55.0 hls.js@1.7.3
          npx playwright install chromium

      - name: Build synthetic adaptive HLS fixture
        run: |
          mkdir -p fixtures/v0 fixtures/v1
          ffmpeg -hide_banner -loglevel error -f lavfi -i "testsrc=size=1280x720:rate=30" -f lavfi -i "sine=frequency=1000:sample_rate=48000" -t 4             -filter_complex "[0:v]split=2[v0][v1];[v1]scale=640:360[v1out]"             -map "[v0]" -map 1:a -map "[v1out]" -map 1:a             -c:v libx264 -preset veryfast -pix_fmt yuv420p -profile:v main -g 60 -sc_threshold 0             -c:a aac -b:a 96k             -b:v:0 1800k -maxrate:v:0 2000k -bufsize:v:0 3600k             -b:v:1 700k -maxrate:v:1 850k -bufsize:v:1 1400k             -f hls -hls_time 1 -hls_list_size 0             -hls_segment_filename "fixtures/v%v/seg%d.ts"             -master_pl_name master.m3u8             -var_stream_map "v:0,a:0 v:1,a:1" fixtures/v%v/index.m3u8

          cp node_modules/hls.js/dist/hls.min.js fixtures/hls.min.js

          python3 - <<'PY'
          from pathlib import Path
          p=Path("js/video-data.js")
          s=p.read_text()
          s=s.replace('hlsManifest: ""', 'hlsManifest: "/fixtures/master.m3u8"')
          p.write_text(s)
          p=Path("player.html")
          s=p.read_text()
          s=s.replace('https://cdn.jsdelivr.net/npm/hls.js@1.7.3/dist/hls.min.js', 'fixtures/hls.min.js')
          p.write_text(s)
          PY

      - name: Start static server
        run: python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/xkiss-http.log 2>&1 &

      - name: Real browser HLS playback test
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from "playwright";
          const browser = await chromium.launch({headless:true});
          const page = await browser.newPage();
          const consoleErrors = [];
          page.on("console", msg => { if (msg.type() === "error") consoleErrors.push(msg.text()); });
          await page.goto("http://127.0.0.1:4173/player.html?id=video-001", {waitUntil:"domcontentloaded"});
          await page.waitForFunction(() => window.XKissPlayerCore?.platformCore?.connected === true);
          await page.waitForFunction(() => window.XKissPlayerQualityRuntime?.adaptiveStarted === true, null, {timeout:10000});
          await page.waitForTimeout(3000);
          const diagnostics = await page.evaluate(() => ({
            runtime: window.XKissPlayerQualityRuntime || null,
            hlsSupported: Boolean(window.Hls && window.Hls.isSupported()),
            qualityLevels: document.querySelectorAll("#qualityMenu [data-hls-level]").length
          }));
          if (!diagnostics.runtime?.manifestParsed || diagnostics.qualityLevels < 2) {
            throw new Error("Adaptive manifest did not fully initialize: " + JSON.stringify(diagnostics));
          }
          const result = await page.evaluate(async () => {
            const v=document.getElementById("video");
            const before=v.currentSrc;
            const playing=new Promise(resolve => {
              const ok=()=>resolve(true);
              const fail=()=>resolve(false);
              v.addEventListener("playing",ok,{once:true});
              v.addEventListener("error",fail,{once:true});
              setTimeout(()=>resolve(false),8000);
            });
            v.play().catch(()=>{});
            const didPlay=await playing;
            return {
              didPlay,
              readyState:v.readyState,
              duration:v.duration,
              currentSrc:v.currentSrc || before,
              hlsLevels:document.querySelectorAll("#qualityMenu [data-hls-level]").length,
              quality:document.getElementById("currentQuality")?.textContent || ""
            };
          });
          if (!result.didPlay || result.readyState < 2 || result.hlsLevels < 2) {
            throw new Error("Adaptive playback failed: " + JSON.stringify(result) + "\nConsole errors: " + JSON.stringify(consoleErrors));
          }
          console.log(JSON.stringify({ok:true, gate:"ADAPTIVE_VIDEO_DELIVERY", result, consoleErrors},null,2));
          await browser.close();
          NODE
