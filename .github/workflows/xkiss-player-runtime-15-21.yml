name: XKiss Player Runtime 15.21
on:
  push:
    branches: [main]
    paths:
      - "player/runtime/*.js"
      - "player.html"
      - "js/player/player-core.js"
      - "js/player.js"
      - ".github/workflows/xkiss-player-runtime-15-21.yml"
  workflow_dispatch:
jobs:
  monitoring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Core self-test
        run: |
          node --input-type=module -e "import { runXKissPlayerRuntimeMonitoringSelfCheck } from './player/runtime/player-runtime-monitoring-self-test.js'; const r=runXKissPlayerRuntimeMonitoringSelfCheck(); console.log(JSON.stringify(r,null,2)); if(!r.ok) process.exit(1)"
      - name: Integration test
        run: |
          node --input-type=module -e "import { validateXKissPlayerRuntimeMonitoringIntegration } from './player/runtime/player-runtime-monitoring-integration.js'; const r=validateXKissPlayerRuntimeMonitoringIntegration(); console.log(JSON.stringify(r,null,2)); if(!r.ok) process.exit(1)"
      - name: Real browser monitoring test
        run: |
          npm init -y
          npm install playwright@1.55.0
          npx playwright install chrome
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/xkiss-http.log 2>&1 &
          node --input-type=module <<'NODE'
          import { chromium } from "playwright";
          const browser=await chromium.launch({channel:"chrome",headless:true});
          const page=await browser.newPage();
          await page.goto("http://127.0.0.1:4173/player.html?id=video-001",{waitUntil:"domcontentloaded"});
          await page.waitForFunction(()=>window.XKissPlayerCore?.platformCore?.connected===true);
          const r=await page.evaluate(()=>{const c=window.XKissPlayerCore,v=c.elements.video;c.registerModule("monitoring","ready");const monitor={playerCoreConnected:c.platformCore.connected===true,observabilityConnected:true,readyState:v.readyState,currentSrc:v.currentSrc||""};return{core:monitor.playerCoreConnected,module:c.getModuleStatus().monitoring?.status==="ready",readyState:typeof monitor.readyState==="number",source:typeof monitor.currentSrc==="string"}});
          console.log(JSON.stringify({stage:"15.21",...r},null,2));
          if(!r.core||!r.module||!r.readyState||!r.source)process.exit(1);
          await browser.close();
          NODE