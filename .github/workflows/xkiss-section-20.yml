name: XKiss Section 20 Final Master Release Lock

on:
  push:
    paths:
      - "release/**"
      - "audit/xkiss-section-20-master-spec.md"
      - ".github/workflows/xkiss-section-20.yml"
      - "audit/xkiss-final-review.js"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  section-20:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check Section 20
        run: |
          node --check release/xkiss-final-master-lock.js
          node --check release/xkiss-final-master-release-self-test.js
          node --check release/xkiss-final-master-regression.js
      - name: Run Section 20 self-test
        run: node --input-type=module -e "import('./release/xkiss-final-master-release-self-test.js').then(m => { const r=m.runSection20SelfTest(); console.log(JSON.stringify(r,null,2)); if(!r.ok) process.exit(1); })"
      - name: Run Section 20 regression
        run: node --input-type=module -e "import('./release/xkiss-final-master-regression.js').then(m => { const r=m.runSection20Regression(); console.log(JSON.stringify(r,null,2)); if(!r.ok) process.exit(1); })"
      - name: Run final review
        run: node audit/xkiss-final-review.js
