name: XKiss Section 18 Autonomous Control
on:
  push:
    paths:
      - "control/**"
      - ".github/workflows/xkiss-section-18.yml"
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  control:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Section 18 verification run: execute the full operational control self-test.
      - name: Run Section 18 operational control
        run: node --input-type=module -e "import('./control/xkiss-control-section-self-test.js').then(async m=>{const r=await m.runControlSectionSelfTest();console.log(JSON.stringify(r,null,2));if(!r.ok)process.exit(1)})"
