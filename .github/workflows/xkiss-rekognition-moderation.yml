name: XKiss Amazon Rekognition Moderation Self-Test

on:
  push:
    branches:
      - "main"
    paths:
      - "safety/rekognition-moderation-provider.js"
      - "safety/tests/rekognition-moderation-provider-self-test.mjs"
      - ".github/workflows/xkiss-rekognition-moderation.yml"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

jobs:
  rekognition-moderation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Rekognition provider self-test
        run: node safety/tests/rekognition-moderation-provider-self-test.mjs
