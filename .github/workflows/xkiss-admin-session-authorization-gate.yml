name: XKiss Admin Session Authorization Gate

on:
  pull_request:
    paths:
      - "worker.js"
      - "admin/xkiss-admin-backend.js"
      - "security/admin-authorization-gate-self-test.js"
      - ".github/workflows/xkiss-admin-session-authorization-gate.yml"
  push:
    branches: [main]
    paths:
      - "worker.js"
      - "admin/xkiss-admin-backend.js"
      - "security/admin-authorization-gate-self-test.js"
      - ".github/workflows/xkiss-admin-session-authorization-gate.yml"

permissions:
  contents: read

jobs:
  admin-session-authorization:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check worker
        run: node --check worker.js
      - name: Verify admin session authorization gate
        run: node security/admin-authorization-gate-self-test.js
