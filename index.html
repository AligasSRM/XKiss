<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="XKiss — 18+ adult video platform">
  <title>XKiss</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #09090d;
      color: #ffffff;
      line-height: 1.5;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    input {
      font: inherit;
    }

    .container {
      width: min(1180px, 92%);
      margin: 0 auto;
    }

    /* HEADER */
    header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(9, 9, 13, 0.96);
      border-bottom: 1px solid #24242d;
      backdrop-filter: blur(12px);
    }

    .header-inner {
      min-height: 70px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .logo {
      font-size: 30px;
      font-weight: 900;
      letter-spacing: -1px;
      white-space: nowrap;
    }

    .nav {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .nav button {
      border: 1px solid #30303a;
      background: #111118;
      color: #ffffff;
      padding: 9px 13px;
      border-radius: 9px;
      cursor: pointer;
      transition: 0.2s;
    }

    .nav button:hover {
      background: #1c1c26;
      border-color: #555565;
    }

    /* HERO */
    .hero {
      padding: 90px 0 70px;
      text-align: center;
      border-bottom: 1px solid #202029;
      background:
        radial-gradient(circle at 50% 20%, #20202c 0, #09090d 55%);
    }

    .badge {
      display: inline-block;
      margin-bottom: 22px;
      padding: 7px 13px;
      border: 1px solid #454552;
      border-radius: 999px;
      color: #d8d8df;
      font-size: 13px;
      font-weight: 700;
    }

    .hero h1 {
      font-size: clamp(42px, 8vw, 78px);
      line-height: 1;
      margin-bottom: 20px;
      letter-spacing: -3px;
    }

    .hero p {
      max-width: 720px;
      margin: 0 auto 30px;
      color: #a8a8b5;
      font-size: 18px;
    }

    .hero-actions {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .primary-btn,
    .secondary-btn {
      border-radius: 10px;
      padding: 13px 20px;
      cursor: pointer;
      font-weight: 700;
      transition: 0.2s;
    }

    .primary-btn {
      border: 1px solid #ffffff;
      background: #ffffff;
      color: #09090d;
    }

    .primary-btn:hover {
      opacity: 0.88;
    }

    .secondary-btn {
      border: 1px solid #3b3b48;
      background: #14141c;
      color: #ffffff;
    }

    .secondary-btn:hover {
      background: #1d1d27;
    }

    /* QUICK ACCESS */
    .section {
      padding: 55px 0;
    }

    .section-header {
      margin-bottom: 25px;
    }

    .section-header h2 {
      font-size: 28px;
      margin-bottom: 6px;
    }

    .section-header p {
      color: #8f8f9d;
    }

    .quick-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
    }

    .quick-card {
      border: 1px solid #272731;
      background: #101017;
      border-radius: 14px;
      padding: 24px;
      cursor: pointer;
      transition: 0.2s;
    }

    .quick-card:hover {
      transform: translateY(-3px);
      border-color: #50505d;
      background: #15151d;
    }

    .quick-card h3 {
      margin-bottom: 8px;
      font-size: 19px;
    }

    .quick-card p {
      color: #92929f;
      font-size: 14px;
    }

    /* PLATFORM SECTIONS */
    .content-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
    }

    .content-card {
      min-height: 180px;
      border: 1px solid #272731;
      border-radius: 14px;
      background: #101017;
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .content-card .number {
      color: #70707d;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .content-card h3 {
      font-size: 20px;
      margin-bottom: 8px;
    }

    .content-card p {
      color: #92929f;
      font-size: 14px;
    }

    .status {
      margin-top: 20px;
      display: inline-block;
      width: fit-content;
      padding: 5px 9px;
      border-radius: 7px;
      border: 1px solid #30303a;
      color: #9d9daa;
      font-size: 12px;
    }

    /* SEARCH */
    .search-box {
      display: flex;
      gap: 10px;
      max-width: 700px;
    }

    .search-box input {
      flex: 1;
      min-width: 0;
      padding: 14px 15px;
      border-radius: 10px;
      border: 1px solid #30303a;
      background: #111118;
      color: #ffffff;
      outline: none;
    }

    .search-box input:focus {
      border-color: #666675;
    }

    .search-message {
      margin-top: 12px;
      color: #888895;
      font-size: 14px;
    }

    /* ADMIN PREVIEW */
    .admin-preview {
      border: 1px solid #292933;
      background: #0e0e14;
      border-radius: 16px;
      padding: 28px;
    }

    .admin-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 20px;
    }

    .admin-item {
      border: 1px solid #25252f;
      background: #13131a;
      padding: 17px;
      border-radius: 10px;
      color: #b5b5c0;
    }

    /* FOOTER */
    footer {
      border-top: 1px solid #22222b;
      padding: 30px 0;
      margin-top: 30px;
      color: #777784;
      text-align: center;
      font-size: 13px;
    }

    /* MOBILE */
    @media (max-width: 800px) {
      .header-inner {
        padding: 14px 0;
        align-items: flex-start;
        flex-direction: column;
      }

      .nav {
        width: 100%;
        justify-content: flex-start;
        overflow-x: auto;
        flex-wrap: nowrap;
        padding-bottom: 3px;
      }

      .nav button {
        flex: 0 0 auto;
      }

      .hero {
        padding: 65px 0 55px;
      }

      .quick-grid,
      .content-grid,
      .admin-grid {
        grid-template-columns: 1fr;
      }

      .search-box {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

  <!-- HEADER -->
  <header>
    <div class="container header-inner">

      <!-- XKiss logo — kept unchanged -->
      <div class="logo">XKiss</div>

      <nav class="nav">
        <button onclick="goTo('home')">Home</button>
        <button onclick="goTo('videos')">Videos</button>
        <button onclick="goTo('live')">Live</button>
        <button onclick="goTo('creators')">Creators</button>
        <button onclick="goTo('categories')">Categories</button>
        <button onclick="goTo('search')">Search</button>
        <button onclick="goTo('account')">Login</button>
