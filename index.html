<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>XKiss</title>

<style>
* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  background: #09090d;
  color: #ffffff;
  font-family: Arial, sans-serif;
}

/* HEADER */

header {
  min-height: 70px;
  background: #14141b;
  border-bottom: 1px solid #292932;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 25px;
  position: sticky;
  top: 0;
  z-index: 100;
}

.logo {
  font-size: 30px;
  font-weight: 800;
  letter-spacing: 1px;
}

nav {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  justify-content: center;
}

nav button {
  background: #22222b;
  color: #ffffff;
  border: 1px solid #363640;
  padding: 10px 15px;
  border-radius: 20px;
  cursor: pointer;
}

nav button:hover {
  background: #30303a;
}

.login-button {
  background: #ffffff;
  color: #111111;
  font-weight: bold;
}

/* HERO */

.hero {
  min-height: 430px;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 60px 20px;
  background:
    radial-gradient(
      circle at center,
      #292936 0%,
      #111118 45%,
      #09090d 80%
    );
}

.hero-content {
  max-width: 800px;
}

.hero h1 {
  font-size: 58px;
  margin: 0 0 18px;
}

.hero p {
  color: #b8b8c2;
  font-size: 19px;
  line-height: 1.6;
  margin-bottom: 30px;
}

.hero-buttons {
  display: flex;
  justify-content: center;
  gap: 12px;
  flex-wrap: wrap;
}

.hero-button {
  border: 0;
  padding: 13px 22px;
  border-radius: 25px;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
}

.primary {
  background: #ffffff;
  color: #111111;
}

.secondary {
  background: #22222b;
  color: #ffffff;
  border: 1px solid #363640;
}

/* GENERAL */

.container {
  max-width: 1250px;
  margin: auto;
  padding: 45px 20px;
}

.section {
  margin-bottom: 55px;
}

.section-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
  margin-bottom: 20px;
}

.section-title {
  font-size: 28px;
  margin: 0;
}

.view-all {
  color: #aaaab5;
  font-size: 14px;
  cursor: pointer;
}

/* VIDEO GRID */

.video-grid {
  display: grid;
  grid-template-columns: repeat(
    auto-fit,
    minmax(240px, 1fr)
  );
  gap: 20px;
}

.video-card {
  background: #14141b;
  border: 1px solid #292932;
  border-radius: 14px;
  overflow: hidden;
  transition: 0.2s;
}

.video-card:hover {
  transform: translateY(-4px);
  border-color: #454552;
}

.thumbnail {
  height: 150px;
  background:
    linear-gradient(
      135deg,
      #292936,
      #111118
    );
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}

.play {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  background: rgba(255,255,255,0.95);
  color: #111111;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
}

.duration {
  position: absolute;
  right: 10px;
  bottom: 10px;
  background: rgba(0,0,0,0.8);
  padding: 5px 7px;
  border-radius: 5px;
  font-size: 12px;
}

.video-info {
  padding: 15px;
}

.video-title {
  font-weight: bold;
  margin-bottom: 8px;
  line-height: 1.4;
}

.creator {
  color: #9999a5;
  font-size: 13px;
  margin-bottom: 12px;
}

.video-meta {
  display: flex;
  justify-content: space-between;
  align-items: center;
  color: #858592;
  font-size: 12px;
}

.badges {
  display: flex;
  gap: 6px;
}

.badge {
  padding: 4px 7px;
  border-radius: 5px;
  background: #24242d;
  color: #ccccd5;
  font-size: 10px;
}

/* LIVE */

.live-grid {
  display: grid;
  grid-template-columns: repeat(
    auto-fit,
    minmax(260px, 1fr)
  );
  gap: 20px;
}

.live-card {
  background: #14141b;
  border: 1px solid #292932;
  border-radius: 14px;
  padding: 20px;
}

.live-top {
  display: flex;
  justify-content: space-between;
  margin-bottom: 15px;
}

.live-dot {
  color: #ffffff;
  font-size: 12px;
}

.live-card h3 {
  margin: 8px 0;
}

.live-card p {
  color: #9999a5;
  font-size: 13px;
}

/* CATEGORIES */

.category-grid {
  display: grid;
  grid-template-columns: repeat(
    auto-fit,
    minmax(160px, 1fr)
  );
  gap: 15px;
}

.category {
  background: #15151c;
  border: 1px solid #292932;
  border-radius: 14px;
  padding: 25px 15px;
  text-align: center;
  cursor: pointer;
  transition: 0.2s;
}

.category:hover {
  transform: translateY(-3px);
  background: #1d1d26;
}

/* CREATORS */

.creator-grid {
  display: grid;
  grid-template-columns: repeat(
    auto-fit,
    minmax(200px, 1fr)
  );
  gap: 18px;
}

.creator-card {
  background: #14141b;
  border: 1px solid #292932;
  border-radius: 14px;
  padding: 20px;
  text-align: center;
}

.creator-avatar {
  width: 70px;
  height: 70px;
  border-radius: 50%;
  background: #292936;
  margin: 0 auto 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
  font-size: 22px;
}

.creator-card h3 {
  margin: 8px 0;
}

.creator-card p {
  margin: 0;
  color: #9999a5;
  font-size: 13px;
}

/* SEARCH */

.search-box {
  display: flex;
  max-width: 700px;
  margin: auto;
}

.search-box input {
  flex: 1;
  padding: 15px 18px;
  border: 1px solid #363640;
  border-right: 0;
  background: #14141b;
  color: #ffffff;
  outline: none;
  border-radius: 25px 0 0 25px;
}

.search-box button {
  padding: 15px 22px;
  border: 0;
  background: #ffffff;
  color: #111111;
  font-weight: bold;
  border-radius: 0 25px 25px 0;
  cursor: pointer;
}

/* FOOTER */

footer {
  margin-top: 40px;
  padding: 35px 20px;
  text-align: center;
  border-top: 1px solid #22222a;
  color: #777783;
}

.footer-links {
  margin-bottom: 15px;
}

.footer-links span {
  margin: 0 10px;
  cursor: pointer;
}

/* MOBILE */

@media (max-width: 700px) {

  header {
    flex-direction: column;
    gap: 15px;
  }

  nav {
    width: 100%;
  }

  nav button {
    padding: 9px 12px;
  }

  .hero {
    min-height: 380px;
  }

  .hero h1 {
    font-size: 40px;
  }

  .hero p {
    font-size: 16px;
  }

  .section-title {
    font-size: 23px;
  }

  .search-box {
    width: 100%;
  }
}
</style>
</head>
