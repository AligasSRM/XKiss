<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#07080b">
<meta name="description" content="Search XKiss videos by title, creator, category or tag.">
<title>XKiss — Search & Categories</title>
<link rel="stylesheet" href="search/search.css">
</head>
<body>
<header class="search-header">
  <nav class="search-nav">
    <a class="brand" href="index.html" aria-label="XKiss Home"><span class="brand-x">X</span><span class="brand-kiss">kiss</span></a>
    <div class="nav-links" aria-label="Primary navigation">
      <a href="index.html">Home</a>
      <a href="videos.html">Videos</a>
      <a class="active" href="search.html">Search</a>
      <a href="index.html#creators">Creators</a>
      <a href="index.html#categories">Categories</a>
    </div>
    <a class="login" href="index.html#account">Login</a>
  </nav>
</header>

<main class="search-page">
  <section class="search-hero">
    <span class="eyebrow">XKISS DISCOVERY</span>
    <h1>Search & Categories</h1>
    <p>Find published videos by title, creator, category or tag.</p>
  </section>

  <section class="search-tools" aria-label="Search and category filters">
    <label class="search-box">
      <span class="sr-only">Search videos</span>
      <input id="search-input" type="search" autocomplete="off" placeholder="Search videos, creators or tags..." aria-label="Search videos, creators or tags">
    </label>
    <div id="category-list" class="category-list" aria-label="Categories"></div>
  </section>

  <section class="search-results-head">
    <div>
      <h2>Results</h2>
      <p id="result-count">0 videos</p>
    </div>
    <div class="search-actions">
      <button id="share-search" class="clear-btn" type="button">Share</button>
      <button id="clear-search" class="clear-btn" type="button">Clear</button>
    </div>
  </section>

  <p id="share-status" class="share-status" role="status" aria-live="polite"></p>

  <section id="results-grid" class="results-grid" aria-live="polite"></section>

  <section id="empty-state" class="empty-state" hidden>
    <div class="empty-icon">X</div>
    <h3>No matching videos</h3>
    <p>Try a different title, creator, category or tag.</p>
  </section>
</main>

<footer class="search-footer">
  <div>XKiss — Search & Categories</div>
  <a href="index.html">Back to Home</a>
</footer>

<script src="js/video-data.js"></script>
<script src="search/search-categories.js"></script>
<script src="search/search-core.js"></script>
<script src="search/search-render.js"></script>
</body>
</html>
